<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniCalc Pro — High-Performance Calculator</title>
  <meta name="description" content="A fast, responsive, and intuitive calculator with standard & scientific modes, calculation history, multiple themes, and keyboard support.">

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Remix Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient background glow -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="app-layout">
    <!-- Main Calculator Unit -->
    <main class="calc-card" role="region" aria-label="Calculator">
      <!-- Calculator Header -->
      <header class="calc-header">
        <div class="calc-brand">
          <div class="brand-icon">
            <i class="ri-calculator-fill"></i>
          </div>
          <div class="brand-text">
            <span class="brand-name">OmniCalc<span class="accent-dot">.</span></span>
            <span class="brand-tag">Precision Engine</span>
          </div>
        </div>

        <div class="header-controls">
          <!-- Scientific Mode Toggle -->
          <button id="mode-toggle-btn" class="util-btn" title="Toggle Scientific Mode" aria-label="Scientific Mode">
            <i class="ri-flask-line"></i>
          </button>

          <!-- History Drawer Toggle -->
          <button id="history-toggle-btn" class="util-btn" title="Calculation History" aria-label="History">
            <i class="ri-history-line"></i>
          </button>

          <!-- Theme Selector Dropdown Trigger -->
          <div class="theme-menu-wrap" id="theme-menu-wrap">
            <button id="theme-btn" class="util-btn" title="Switch Theme" aria-label="Switch Theme" aria-haspopup="true">
              <i class="ri-palette-line"></i>
            </button>
            <div class="theme-dropdown hidden" id="theme-dropdown">
              <div class="dropdown-title">Select Theme</div>
              <button class="theme-item active" data-theme="midnight">
                <span class="dot dot-midnight"></span> Midnight Obsidian
              </button>
              <button class="theme-item" data-theme="cyberpunk">
                <span class="dot dot-cyberpunk"></span> Cyberpunk Neon
              </button>
              <button class="theme-item" data-theme="aurora">
                <span class="dot dot-aurora"></span> Emerald Aurora
              </button>
              <button class="theme-item" data-theme="sunset">
                <span class="dot dot-sunset"></span> Sunset Dusk
              </button>
              <button class="theme-item" data-theme="light">
                <span class="dot dot-light"></span> Luxe Light
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Calculator Display Screen -->
      <section class="calc-screen" aria-live="polite">
        <!-- Live Expression Line -->
        <div class="screen-top">
          <div class="expression-line" id="expression-display"></div>
        </div>

        <!-- Main Real-Time Result / Input Line -->
        <div class="screen-bottom">
          <button id="copy-btn" class="copy-btn" title="Copy Result" aria-label="Copy Result">
            <i class="ri-file-copy-line"></i>
          </button>
          <div class="result-line" id="result-display">0</div>
        </div>
      </section>

      <!-- Keypad Grid -->
      <section class="calc-keypad" id="calc-keypad">
        <!-- Scientific Panel (Collapsible 4-column layout) -->
        <div class="scientific-panel hidden" id="scientific-panel">
          <button class="key sci-key" data-action="sin" title="Sine">sin</button>
          <button class="key sci-key" data-action="cos" title="Cosine">cos</button>
          <button class="key sci-key" data-action="tan" title="Tangent">tan</button>
          <button class="key sci-key" data-action="pi" title="Pi (π)">π</button>

          <button class="key sci-key" data-action="sqrt" title="Square Root">√</button>
          <button class="key sci-key" data-action="power" title="Power (xʸ)">xʸ</button>
          <button class="key sci-key" data-action="log" title="Log (base 10)">log</button>
          <button class="key sci-key" data-action="ln" title="Natural Log">ln</button>

          <button class="key sci-key" data-action="bracket-open" title="Open Parenthesis">(</button>
          <button class="key sci-key" data-action="bracket-close" title="Close Parenthesis">)</button>
          <button class="key sci-key" data-action="fact" title="Factorial (n!)">n!</button>
          <button class="key sci-key" data-action="e" title="Euler's Constant">e</button>
        </div>

        <!-- Standard Intuitive 4-Column Layout (Industry Standard) -->
        <div class="standard-keys">
          <!-- Row 1 -->
          <button class="key func-key clear-key" data-action="clear" data-key="Escape" title="Clear All (Esc)">AC</button>
          <button class="key func-key del-key" data-action="delete" data-key="Backspace" title="Delete Last (Backspace)">
            <i class="ri-delete-back-2-line"></i>
          </button>
          <button class="key func-key" data-action="percent" data-key="%" title="Percentage (%)">%</button>
          <button class="key op-key" data-action="operator" data-val="/" data-key="/" title="Divide (/)">÷</button>

          <!-- Row 2 -->
          <button class="key num-key" data-val="7" data-key="7">7</button>
          <button class="key num-key" data-val="8" data-key="8">8</button>
          <button class="key num-key" data-val="9" data-key="9">9</button>
          <button class="key op-key" data-action="operator" data-val="*" data-key="*" title="Multiply (*)">×</button>

          <!-- Row 3 -->
          <button class="key num-key" data-val="4" data-key="4">4</button>
          <button class="key num-key" data-val="5" data-key="5">5</button>
          <button class="key num-key" data-val="6" data-key="6">6</button>
          <button class="key op-key" data-action="operator" data-val="-" data-key="-" title="Subtract (-)">−</button>

          <!-- Row 4 -->
          <button class="key num-key" data-val="1" data-key="1">1</button>
          <button class="key num-key" data-val="2" data-key="2">2</button>
          <button class="key num-key" data-val="3" data-key="3">3</button>
          <button class="key op-key" data-action="operator" data-val="+" data-key="+" title="Add (+)">+</button>

          <!-- Row 5 -->
          <button class="key func-key" data-action="negate" title="Toggle Sign (±)">±</button>
          <button class="key num-key" data-val="0" data-key="0">0</button>
          <button class="key num-key" data-val="." data-key="." title="Decimal Point">.</button>
          <button class="key equals-key" data-action="calculate" data-key="Enter" title="Calculate (Enter)">=</button>
        </div>
      </section>

      <!-- Calculator Footer -->
      <footer class="calc-footer">
        <button class="keyboard-legend-pill" id="shortcuts-btn" title="View Keyboard Shortcuts">
          <i class="ri-keyboard-line"></i>
          <span>Keyboard Enabled</span>
        </button>
        <span class="precision-badge">High Precision</span>
      </footer>
    </main>

    <!-- Slide-in History Tape Drawer -->
    <aside class="history-drawer hidden" id="history-drawer" aria-label="Calculation History">
      <div class="history-header">
        <div class="history-title">
          <i class="ri-history-line"></i>
          <h3>History Tape</h3>
        </div>
        <div class="history-actions">
          <button id="clear-history-btn" class="clear-history-btn" title="Clear All History">
            <i class="ri-delete-bin-line"></i> Clear
          </button>
          <button id="close-history-btn" class="close-history-btn" title="Close Drawer" aria-label="Close History">
            <i class="ri-close-line"></i>
          </button>
        </div>
      </div>

      <div class="history-list" id="history-list">
        <!-- Rendered dynamically by script.js -->
        <div class="history-empty">
          <i class="ri-draft-line"></i>
          <p>No calculation history yet.<br>Start calculating!</p>
        </div>
      </div>
    </aside>
  </div>

  <!-- Keyboard Shortcuts Modal Dialog -->
  <dialog class="shortcuts-modal" id="shortcuts-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3><i class="ri-keyboard-line"></i> Keyboard Controls</h3>
        <button id="close-modal-btn" class="close-modal-btn"><i class="ri-close-line"></i></button>
      </div>
      <div class="modal-body">
        <div class="shortcut-item"><kbd>0</kbd>–<kbd>9</kbd> <span>Numbers</span></div>
        <div class="shortcut-item"><kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> <span>Arithmetic Operators</span></div>
        <div class="shortcut-item"><kbd>Enter</kbd> or <kbd>=</kbd> <span>Calculate Result</span></div>
        <div class="shortcut-item"><kbd>Backspace</kbd> <span>Delete last character</span></div>
        <div class="shortcut-item"><kbd>Esc</kbd> or <kbd>c</kbd> <span>Clear All</span></div>
        <div class="shortcut-item"><kbd>%</kbd> <span>Percentage</span></div>
      </div>
    </div>
  </dialog>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <i class="toast-icon ri-check-line"></i>
    <span class="toast-msg">Copied to clipboard!</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
